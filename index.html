<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus ERP</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        /* 
           Adaptive overlay to hide the Lovable badge.
           Uses backdrop-filter to blur and wash out the badge while 
           remaining transparent enough to adapt to background changes.
        */
        .hide-badge {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 180px;
            height: 50px;
            /* Using blur and high brightness to wash out the badge */
            backdrop-filter: blur(10px) brightness(1.2);
            -webkit-backdrop-filter: blur(10px) brightness(1.2);
            /* A very subtle white tint that works well in both light and dark modes */
            background-color: rgba(255, 255, 255, 0.05);
            z-index: 9999;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <iframe src="https://nexus-erp-software.lovable.app" allowfullscreen></iframe>
    <div class="hide-badge"></div>
</body>
</html>
